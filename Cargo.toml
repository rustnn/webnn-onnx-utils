[package]
name = "webnn-onnx-utils"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Shared utilities for ONNX <-> WebNN conversion (types, op names, attrs, tensor data, etc.)"
readme = "README.md"
repository = "https://github.com/rustnn/webnn-onnx-utils"
homepage = "https://github.com/rustnn/webnn-onnx-utils"
documentation = "https://docs.rs/webnn-onnx-utils"
keywords = ["onnx", "webnn", "tensor", "interop"]
categories = ["api-bindings", "encoding", "science"]
include = [
    "/src",
    "/tests",
    "/protos",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[lib]
path = "src/lib.rs"

[dependencies]
prost = "0.12"
prost-types = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
once_cell = "1.19"
half = "2.4"

[build-dependencies]
prost-build = "0.12"

[features]
default = []
